
<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ea580c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Shlok Bhashantar Scanner</title>
    <meta name="description" content="Mahabharata and Bhagavad Gita Shlok scanner and explanation app with Marathi voiceover.">
    <meta property="og:title" content="Shlok Bhashantar Scanner">
    <meta property="og:description" content="Mahabharata and Bhagavad Gita Shlok scanner and explanation app with Marathi voiceover.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fcf8f1;
            color: #2d2d2d;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .devanagari {
            font-family: 'Noto Sans Devanagari', sans-serif;
            user-select: text;
        }
        .serif {
            font-family: 'Playfair Display', serif;
        }
        .saffron-gradient {
            background: linear-gradient(135deg, #ea580c 0%, #f59e0b 100%);
        }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        @keyframes wave {
            0%, 100% { height: 4px; opacity: 0.3; }
            50% { height: 24px; opacity: 1; }
        }
        .animate-wave {
            animation: wave 1s infinite ease-in-out;
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #ffedd5;
            border-radius: 10px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ea580c;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 2px solid white;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
